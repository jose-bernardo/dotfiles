[global/wm]

include-file = $HOME/.config/polybar/mocha.ini

[bar/top]
background = ${colors.base}
border-color = ${colors.base}
border-size = 4pt
font-0 = FiraCode Nerd Font Mono:size=12;2
foreground = ${colors.surface0}
width = 100%
height = 14pt

modules-left = bspwm
modules-center =
modules-right = now-playing sep date

wm-restack = bspwm

[module/systray]
type = internal/tray

[module/sep]
type = custom/text

format = <label>
format-background = ${colors.base}
format-foreground = ${colors.text}

label = "| "

[module/title]
type = internal/xwindow

format = <label>
format-background = ${colors.base}
format-foreground = ${colors.text}

label = %title%
label-maxlen = 30

label-empty =
label-empty-foreground = #707880

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = false
reverse-scroll = false
occupied-scroll = true

ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5

label-focused = 
label-focused-background = ${colors.lavender}
label-focused-foreground = ${colors.surface0}
label-focused-padding = 2

label-occupied = 󰄯
label-occupied-background = ${colors.base}
label-occupied-foreground = ${colors.text}
label-occupied-padding = 2

label-empty = 󰄰
label-empty-background = ${colors.base}
label-empty-foreground = ${colors.text}
label-empty-padding = 2

label-urgent = 
label-urgent-background = ${colors.base}
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d%
time = %H:%M

format = <label>
format-background = ${colors.base}
format-foreground = ${colors.text}
format-sufix = " "

label = " %date% 󰥔 %time% "
label-font = 3
label-foreground = ${colors.text}

[module/now-playing]
type = custom/script

exec = "sh $HOME/.config/polybar/scripts/get_spotify_status.sh"

format = <label>
format-prefix = " "
format-suffix = " "
format-foreground = ${colors.text}

label = "%output%"
label-maxlen = 30

internal = 1.0

[module/wireless-network]
type = internal/network
interface = wlp7s0

interval = 3.0

format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>

label-connected = %essid% %downspeed:9%
label-connected-foreground = #eefafa

label-disconnected = not connected
label-disconnected-foreground = #66ffff

ramp-signal-0 = 😱
ramp-signal-1 = 😠
ramp-signal-2 = 😒
ramp-signal-3 = 😊
ramp-signal-4 = 😃
ramp-signal-5 = 😈
